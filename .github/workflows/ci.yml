name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, migrations and tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sitehealth
          POSTGRES_USER: sitehealth
          POSTGRES_PASSWORD: sitehealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitehealth -d sitehealth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sitehealth:sitehealth@localhost:5432/sitehealth
      DJANGO_SETTINGS_MODULE: sitehealth.settings.test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gettext

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci

      - name: Build CSS and fonts
        run: npm run build

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy .

      - name: Compile translations
        run: python manage.py compilemessages --ignore=node_modules

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate up, down and up again
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo_content
          python manage.py migrate audits zero --noinput
          python manage.py migrate briefs zero --noinput
          python manage.py migrate --noinput

      - name: Tests
        run: pytest

  accessibility:
    name: Accessibility (production image)
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the production image
        run: docker compose --profile prod up --detach --build --wait web-prod

      - name: Prepare content and run an audit
        run: |
          docker compose exec -T web-prod python manage.py migrate --noinput
          docker compose exec -T web-prod python manage.py seed_demo_content
          docker compose exec -T web-prod python manage.py run_audits

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run axe-core and keyboard checks
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy
    needs: [checks, accessibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL is not set; skipping deployment."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            "$DEPLOY_WEBHOOK_URL"
