services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitehealth
      POSTGRES_USER: sitehealth
      POSTGRES_PASSWORD: sitehealth
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitehealth -d sitehealth"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgres://sitehealth:sitehealth@db:5432/sitehealth
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web-prod:
    profiles: [prod]
    build:
      context: .
      target: production
    environment:
      SECRET_KEY: local-production-check-only
      DATABASE_URL: postgres://sitehealth:sitehealth@db:5432/sitehealth
      ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: http://localhost:8001
      WAGTAILADMIN_BASE_URL: http://localhost:8001
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  assets:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci && npm run watch:css"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres-data:
  media:
