{% load i18n %}
<figure class="specimen">
  <div class="sheet" aria-hidden="true">
    <div class="flex items-center justify-between gap-4">
      <span class="font-mono text-xs text-pencil">/briefs/grid-storage/</span>
      <span class="flex gap-1.5 font-mono text-xs">
        <span class="bg-paper-sunken px-1.5 py-0.5">EN</span>
        <span class="relative bg-marker px-1.5 py-0.5">FR —<span class="pin pin-flag pin-corner" style="--pin-order: 1">2</span></span>
      </span>
    </div>
    <p class="specimen-title">
      <span class="pin" style="--pin-order: 0">1</span>{% translate "Grid storage after the 2025 auctions" %}
    </p>
    <p class="mt-3 text-sm text-pencil">{% translate "1 September 2026 · By Dickson Ojochogwu" %}</p>
    <p class="specimen-body">
      <span class="pin pin-flag" style="top: 1.6em; --pin-order: 2">3</span>{% translate "Prices for four-hour storage fell by a third between the two auction rounds, with" %} <span class="bg-marker underline">{% translate "full results published" %}</span> {% translate "in March." %}
    </p>
    <div class="specimen-image">
      <span class="pin" style="top: calc(50% - var(--pin-size) / 2); --pin-order: 3">4</span>
    </div>
  </div>

  <figcaption class="mt-12">
    <p class="kicker">{% translate "Example: one brief, inspected" %}</p>
    <ol class="mt-5 grid gap-x-10 gap-y-5 sm:grid-cols-2" role="list">
      {% include "briefs/components/specimen_note.html" with number=1 note=_("Exactly one main heading.") code="seo.h1_count · pass" %}
      {% include "briefs/components/specimen_note.html" with number=2 note=_("No French version of this brief yet.") code="i18n.missing_translation" is_flagged=True %}
      {% include "briefs/components/specimen_note.html" with number=3 note=_("Link failed three checks in a row.") code="link.broken" is_flagged=True %}
      {% include "briefs/components/specimen_note.html" with number=4 note=_("Image has descriptive alt text.") code="a11y.img_alt · pass" %}
    </ol>
  </figcaption>
</figure>
