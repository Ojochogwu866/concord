<li class="specimen-note">
  <span class="flex size-7 items-center justify-center rounded-full border-2 border-ink text-xs font-bold{% if is_flagged %} bg-marker{% endif %}" aria-hidden="true">{{ number }}</span>
  <span>{{ note }}<code class="code-label mt-1 block text-pencil">{{ code }}</code></span>
</li>
