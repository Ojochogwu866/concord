{% load wagtailcore_tags %}
{% with heading=heading_tag|default:"h2" %}
<article class="py-5">
  <{{ heading }} class="text-2xl leading-tight font-bold tracking-tight sm:text-3xl">
    <a href="{% pageurl brief %}"><span class="sweep-title" style="view-transition-name: brief-title-{{ brief.pk }}">{{ brief.title }}</span></a>
  </{{ heading }}>
  <p class="mt-2 max-w-prose text-pencil">{{ brief.summary }}</p>
  <div class="mt-3">{% include "briefs/components/byline.html" with brief=brief %}</div>
</article>
{% endwith %}
