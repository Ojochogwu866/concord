{% load wagtailcore_tags %}
{% with heading=heading_tag|default:"h2" %}
<article class="py-6">
  <{{ heading }} class="text-xl font-semibold">
    <a class="hover:text-accent hover:underline" href="{% pageurl brief %}">{{ brief.title }}</a>
  </{{ heading }}>
  {% include "briefs/components/byline.html" with brief=brief %}
  <p class="mt-3 max-w-prose text-ink-muted">{{ brief.summary }}</p>
</article>
{% endwith %}
