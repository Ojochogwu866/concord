{% extends "base.html" %}
{% load i18n wagtailcore_tags %}

{% block content %}
  <div class="page-container">
    <h1 class="text-4xl font-semibold tracking-tight">{{ page.title }}</h1>
    {% if page.intro %}
      <div class="rich-text mt-6">{{ page.intro|richtext }}</div>
    {% endif %}
    {% if brief_index %}
      <p class="mt-8">
        <a class="text-link" href="{% pageurl brief_index %}">{% translate "Read the briefs" %}</a>
      </p>
    {% endif %}
  </div>
{% endblock %}
