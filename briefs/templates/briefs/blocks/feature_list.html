{% extends "briefs/blocks/section.html" %}

{% block section_body %}
  <ul class="mt-8 grid gap-x-12 gap-y-10 sm:grid-cols-2" role="list">
    {% for item in value.items %}
      <li class="max-w-prose">
        <h3 class="text-lg font-semibold">{{ item.title }}</h3>
        <p class="mt-2 text-ink-muted">{{ item.description }}</p>
        {% if item.code %}<p class="mt-3"><code class="code-label">{{ item.code }}</code></p>{% endif %}
      </li>
    {% endfor %}
  </ul>
{% endblock %}
