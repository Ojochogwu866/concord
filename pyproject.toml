[project]
name = "sitehealth"
version = "0.1.0"
requires-python = ">=3.14"

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Settings modules layer on base.py through star imports by design.
"sitehealth/settings/*.py" = ["F403", "F405"]
"**/tests/**" = ["S101"]
# Test settings use a fixed, throwaway secret key.
"sitehealth/settings/test.py" = ["S105"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["wagtail.*", "modelcluster.*", "taggit.*", "dj_database_url.*", "whitenoise.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "sitehealth.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sitehealth.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers"
